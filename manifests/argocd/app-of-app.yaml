apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-apps-auto-deploy
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  source:
    path: manifests/applications
    repoURL: "https://github.com/itgix/adp-az-client-argo-demo.git"
    targetRevision: HEAD
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true